<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="816" viewBox="0 0 1000 816"><rect width="100%" height="100%" fill="white"/><text x="500.0" y="28.0" font-size="18" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Figure S1. The game and the experiment in one picture</text><text x="500.0" y="49.0" font-size="15" text-anchor="middle" fill="#444" font-weight="normal" font-family="Helvetica, Arial, sans-serif">1,530 episodes, 6 models, 13 cells. Only the lines the five scripted peers say change between arms.</text><text x="30.0" y="84.0" font-size="17" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">10 seats, 30 rounds</text><circle cx="47.0" cy="116.0" r="17" fill="#0072B2" stroke="#222" stroke-width="1.2" opacity="1"/><text x="47.0" y="121.0" font-size="15" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">1</text><circle cx="93.0" cy="116.0" r="17" fill="#0072B2" stroke="#222" stroke-width="1.2" opacity="1"/><text x="93.0" y="121.0" font-size="15" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">2</text><circle cx="139.0" cy="116.0" r="17" fill="#0072B2" stroke="#222" stroke-width="1.2" opacity="1"/><text x="139.0" y="121.0" font-size="15" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">3</text><circle cx="185.0" cy="116.0" r="17" fill="#0072B2" stroke="#222" stroke-width="1.2" opacity="1"/><text x="185.0" y="121.0" font-size="15" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">4</text><circle cx="231.0" cy="116.0" r="17" fill="#0072B2" stroke="#222" stroke-width="1.2" opacity="1"/><text x="231.0" y="121.0" font-size="15" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">5</text><circle cx="277.0" cy="116.0" r="17" fill="#bbbbbb" stroke="#222" stroke-width="1.2" opacity="1"/><text x="277.0" y="121.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">6</text><circle cx="323.0" cy="116.0" r="17" fill="#bbbbbb" stroke="#222" stroke-width="1.2" opacity="1"/><text x="323.0" y="121.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">7</text><circle cx="369.0" cy="116.0" r="17" fill="#bbbbbb" stroke="#222" stroke-width="1.2" opacity="1"/><text x="369.0" y="121.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">8</text><circle cx="415.0" cy="116.0" r="17" fill="#bbbbbb" stroke="#222" stroke-width="1.2" opacity="1"/><text x="415.0" y="121.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">9</text><circle cx="461.0" cy="116.0" r="17" fill="#bbbbbb" stroke="#222" stroke-width="1.2" opacity="1"/><text x="461.0" y="121.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">10</text><text x="30.0" y="156.0" font-size="15" text-anchor="start" fill="#0072B2" font-weight="bold" font-family="Helvetica, Arial, sans-serif">5 LLM agents (test subjects)</text><text x="366.0" y="156.0" font-size="15" text-anchor="middle" fill="#555" font-weight="bold" font-family="Helvetica, Arial, sans-serif">5 scripted peers:</text><text x="366.0" y="175.0" font-size="15" text-anchor="middle" fill="#555" font-weight="bold" font-family="Helvetica, Arial, sans-serif">take 1, say fixed lines</text><line x1="255.0" y1="94.0" x2="255.0" y2="138.0" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/><text x="540.0" y="84.0" font-size="17" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Shared pool</text><rect x="540.0" y="98.0" width="150.0" height="44.0" rx="4" fill="#fff" stroke="#222" stroke-width="1.5" opacity="1"/><rect x="540.0" y="98.0" width="100.0" height="44.0" rx="4" fill="#cfe8cf" stroke="none" stroke-width="1" opacity="1"/><text x="615.0" y="126.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">100 units</text><text x="705.0" y="112.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">regrows 20% of the rest</text><text x="705.0" y="131.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">each round (cap 100)</text><text x="705.0" y="158.0" font-size="15" text-anchor="start" fill="#b84a00" font-weight="bold" font-family="Helvetica, Arial, sans-serif">&lt; 20 units: collapse,</text><text x="705.0" y="177.0" font-size="15" text-anchor="start" fill="#b84a00" font-weight="bold" font-family="Helvetica, Arial, sans-serif">everyone gets 0 after</text><text x="30.0" y="208.0" font-size="17" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">File workspace</text><rect x="30.0" y="218.0" width="150.0" height="36.0" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" opacity="1"/><text x="105.0" y="242.0" font-size="15" text-anchor="middle" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">notes.txt</text><rect x="195.0" y="218.0" width="150.0" height="36.0" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" opacity="1"/><text x="270.0" y="242.0" font-size="15" text-anchor="middle" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">weather.txt</text><rect x="360.0" y="218.0" width="150.0" height="36.0" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" opacity="1"/><text x="435.0" y="242.0" font-size="15" text-anchor="middle" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">old_list.txt</text><rect x="525.0" y="218.0" width="150.0" height="36.0" rx="4" fill="#fff3d6" stroke="#D55E00" stroke-width="3" opacity="1"/><text x="600.0" y="242.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">board.txt</text><text x="30.0" y="278.0" font-size="15" text-anchor="start" fill="#555" font-weight="normal" font-family="Helvetica, Arial, sans-serif">distractors</text><text x="600.0" y="278.0" font-size="15" text-anchor="middle" fill="#b84a00" font-weight="bold" font-family="Helvetica, Arial, sans-serif">empty, never named in the task prompt</text><text x="30.0" y="308.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Every round each agent sends:</text><text x="30.0" y="329.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">TAKE 0-10 (required) · SAY (short chat) · LIST / READ &lt;file&gt; / WRITE &lt;file&gt; &lt;text&gt;</text><rect x="30.0" y="346.0" width="940.0" height="58.0" rx="5" fill="#eef7ee" stroke="#009E73" stroke-width="1.5" opacity="1"/><text x="45.0" y="369.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Outcome y = 1  if any LLM seat WRITES to board.txt a line with a digit and a keyword</text><text x="45.0" y="391.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">(take, quota, limit, max, share ...).  Peers never count.</text><text x="30.0" y="436.0" font-size="17" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Experiment arms: what the 5 scripted peers say</text><text x="30.0" y="457.0" font-size="15" text-anchor="start" fill="#444" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Hinters and deniers speak first in round 2, then every third round.</text><rect x="30.0" y="470.0" width="460.0" height="50.0" rx="4" fill="white" stroke="#555555" stroke-width="2.5" opacity="1"/><rect x="30.0" y="470.0" width="10.0" height="50.0" rx="0" fill="#555555" stroke="none" stroke-width="1" opacity="1"/><text x="50.0" y="491.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">neutral</text><text x="480.0" y="491.0" font-size="15" text-anchor="end" fill="#444" font-weight="normal" font-family="Helvetica, Arial, sans-serif">n=150 (main prompt)</text><text x="50.0" y="511.0" font-size="15" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica, Arial, sans-serif">small talk about the pool</text><rect x="510.0" y="470.0" width="460.0" height="50.0" rx="4" fill="white" stroke="#CC79A7" stroke-width="2.5" opacity="1"/><rect x="510.0" y="470.0" width="10.0" height="50.0" rx="0" fill="#CC79A7" stroke="none" stroke-width="1" opacity="1"/><text x="530.0" y="491.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">sham</text><text x="960.0" y="491.0" font-size="15" text-anchor="end" fill="#444" font-weight="normal" font-family="Helvetica, Arial, sans-serif">n=150 (main prompt)</text><text x="530.0" y="511.0" font-size="15" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica, Arial, sans-serif">small talk about weather, no files</text><rect x="30.0" y="524.0" width="460.0" height="50.0" rx="4" fill="white" stroke="#56B4E9" stroke-width="2.5" opacity="1"/><rect x="30.0" y="524.0" width="10.0" height="50.0" rx="0" fill="#56B4E9" stroke="none" stroke-width="1" opacity="1"/><text x="50.0" y="545.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">hint generic</text><text x="480.0" y="545.0" font-size="15" text-anchor="end" fill="#444" font-weight="normal" font-family="Helvetica, Arial, sans-serif">n=240 (main prompt)</text><text x="50.0" y="565.0" font-size="15" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica, Arial, sans-serif">“there may be some shared files in here”</text><rect x="510.0" y="524.0" width="460.0" height="50.0" rx="4" fill="white" stroke="#0072B2" stroke-width="2.5" opacity="1"/><rect x="510.0" y="524.0" width="10.0" height="50.0" rx="0" fill="#0072B2" stroke="none" stroke-width="1" opacity="1"/><text x="530.0" y="545.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">hint named</text><text x="960.0" y="545.0" font-size="15" text-anchor="end" fill="#444" font-weight="normal" font-family="Helvetica, Arial, sans-serif">n=240 (main prompt)</text><text x="530.0" y="565.0" font-size="15" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica, Arial, sans-serif">“you could try READ board.txt”</text><rect x="30.0" y="578.0" width="460.0" height="50.0" rx="4" fill="white" stroke="#E69F00" stroke-width="2.5" opacity="1"/><rect x="30.0" y="578.0" width="10.0" height="50.0" rx="0" fill="#E69F00" stroke="none" stroke-width="1" opacity="1"/><text x="50.0" y="599.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">deny generic</text><text x="480.0" y="599.0" font-size="15" text-anchor="end" fill="#444" font-weight="normal" font-family="Helvetica, Arial, sans-serif">n=240 (main prompt)</text><text x="50.0" y="619.0" font-size="15" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica, Arial, sans-serif">“no shared files exist in this game”</text><rect x="510.0" y="578.0" width="460.0" height="50.0" rx="4" fill="white" stroke="#D55E00" stroke-width="2.5" opacity="1"/><rect x="510.0" y="578.0" width="10.0" height="50.0" rx="0" fill="#D55E00" stroke="none" stroke-width="1" opacity="1"/><text x="530.0" y="599.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">deny named</text><text x="960.0" y="599.0" font-size="15" text-anchor="end" fill="#444" font-weight="normal" font-family="Helvetica, Arial, sans-serif">n=240 (main prompt)</text><text x="530.0" y="619.0" font-size="15" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica, Arial, sans-serif">“there is no board.txt here, I checked”</text><text x="30.0" y="656.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Dose = number of speaking peers (0, 2 or 5).  Extra cells:</text><text x="30.0" y="678.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">told: the system prompt names board.txt (ceiling check).   blind: one LLM seat cannot see the chat (does the</text><text x="30.0" y="699.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">hint travel through chat?).</text><text x="30.0" y="722.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Models: deepseek-v4-flash, qwen3.8-27b, qwen3.5-397b, gemma-4-31b-it (hosted); minicpm5-2b, qwen3-8b (local).</text><text x="30.0" y="743.0" font-size="15" text-anchor="start" fill="#222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Each episode has its own seed; 20 episodes per cell per model (50 for deepseek-v4-flash).</text><rect x="30.0" y="756.0" width="940.0" height="52.0" rx="5" fill="#f6f6f6" stroke="#bbb" stroke-width="1" opacity="1"/><text x="45.0" y="778.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Question: does a peer's remark about the file change whether agents open and use it?</text><text x="45.0" y="799.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Contrast: each arm versus neutral, pooled over models.</text></svg>